<!doctype html>
<html lang="en" data-theme="blue">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workspace &mdash; Dhanadurga</title>
<style>
  /* ===== Dhanadurga WORKSPACE  ·  unified app portal ===== */
  :root, [data-theme="blue"] {
    --bg:#fffaf6; --surface:#ffffff; --surface-2:#fff7f1; --sunk:#fff1ea;
    --text:#0b0b0f; --text-soft:#4b5563; --text-muted:#9ca3af; --border:#e5e7eb;
    --primary:#ff4500; --primary-hover:#e63e00; --primary-soft:#fff1ea;
    --rail:#0b0b0f; --rail-soft:#1f2937;
    --shadow-sm:0 1px 2px rgba(11,11,15,.06);
    --shadow:0 4px 16px rgba(11,11,15,.10); --shadow-lg:0 18px 50px rgba(11,11,15,.20);
    --ring:rgba(255,69,0,.30);
  }
  [data-theme="light"] {
    --bg:#fdf6f0; --surface:#ffffff; --surface-2:#fbf3ec; --sunk:#f3e7dd;
    --text:#111827; --text-soft:#4b5563; --text-muted:#9ca3af; --border:#e5e7eb;
    --primary:#ff4500; --primary-hover:#e63e00; --primary-soft:#fff1ea;
    --rail:#1f2937; --rail-soft:#374151;
    --shadow-sm:0 1px 2px rgba(0,0,0,.06);
    --shadow:0 4px 16px rgba(0,0,0,.1); --shadow-lg:0 18px 50px rgba(0,0,0,.18);
    --ring:rgba(255,69,0,.35);
  }
  [data-theme="dark"] {
    --bg:#1a120e; --surface:#241a14; --surface-2:#2e2118; --sunk:#15100c;
    --text:#fbeee6; --text-soft:#d6c4b6; --text-muted:#a08d7e; --border:#3a2c22;
    --primary:#ff8c00; --primary-hover:#ff4500; --primary-soft:#3a2218;
    --rail:#100b08; --rail-soft:#2e2118;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 4px 16px rgba(0,0,0,.4); --shadow-lg:0 18px 50px rgba(0,0,0,.55);
    --ring:rgba(255,140,0,.5);
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  a { color:inherit; text-decoration:none; }
  button { font-family:inherit; cursor:pointer; }
  ::selection { background:var(--primary); color:#fff; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  @keyframes fade { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  @keyframes pop { from{opacity:0;transform:scale(.96);} to{opacity:1;transform:scale(1);} }

  /* ---- Top bar ---- */
  .topbar {
    height:56px; display:flex; align-items:center; gap:16px; padding:0 16px;
    background:var(--surface); border-bottom:1px solid var(--border); position:relative; z-index:30;
  }
  .tb-brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; }
  .tb-brand .mark {
    width:32px; height:32px; border-radius:8px; display:grid; place-items:center; color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary-hover));
  }
  .tb-brand small { display:block; font-size:10px; font-weight:600; color:var(--text-muted); }
  .tb-search { position:relative; flex:1; max-width:520px; }
  .tb-search svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--text-muted); }
  .tb-search input {
    width:100%; height:38px; border:1px solid var(--border); background:var(--surface-2);
    border-radius:9px; padding:0 12px 0 34px; font-size:13.5px; color:var(--text); outline:none;
  }
  .tb-search input:focus { border-color:var(--primary); background:var(--surface); box-shadow:0 0 0 3px var(--ring); }
  .tb-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .tb-btn { width:38px; height:38px; border-radius:9px; border:0; background:transparent; color:var(--text-soft); display:grid; place-items:center; }
  .tb-btn:hover { background:var(--surface-2); color:var(--primary); }
  .tb-btn svg { width:19px; height:19px; }
  .tb-btn.has-dot { position:relative; }
  .tb-btn.has-dot::after { content:""; position:absolute; top:8px; right:9px; width:7px; height:7px; border-radius:50%; background:#e2574c; border:2px solid var(--surface); }
  .themeset { display:flex; gap:5px; padding:0 4px; }
  .sw { width:20px; height:20px; border-radius:50%; border:2px solid var(--border); padding:0; }
  .sw.on { border-color:var(--text); transform:scale(1.12); }
  .sw-blue { background:linear-gradient(135deg,#ff4500,#e63e00); }
  .sw-light { background:linear-gradient(135deg,#ff8c00,#ff4500); }
  .sw-dark { background:linear-gradient(135deg,#1a120e 50%,#ff8c00 50%); }
  .tb-avatar { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:800; font-size:13px; background:linear-gradient(135deg,var(--primary),var(--primary-hover)); }

  /* ---- Layout ---- */
  .ws-body { display:flex; height:calc(100vh - 56px); }
  .rail {
    width:68px; background:var(--rail); display:flex; flex-direction:column; align-items:center;
    gap:6px; padding:10px 0; overflow-y:auto; flex-shrink:0;
  }
  .rail::-webkit-scrollbar { width:0; }
  .rail-btn {
    width:46px; height:46px; border-radius:13px; border:0; background:transparent;
    display:grid; place-items:center; color:#fff; position:relative; transition:all .14s ease;
  }
  .rail-btn:hover { background:var(--rail-soft); }
  .rail-btn.on { background:rgba(255,255,255,.16); }
  .rail-btn.on::before { content:""; position:absolute; left:-10px; top:11px; width:4px; height:24px; border-radius:0 4px 4px 0; background:#fff; }
  .rail-btn .ic { width:24px; height:24px; border-radius:7px; display:grid; place-items:center; color:#fff; font-size:11px; font-weight:800; }
  .rail-btn svg { width:21px; height:21px; }
  .rail-sep { width:32px; height:1px; background:rgba(255,255,255,.16); margin:4px 0; }
  .rail-tip {
    position:absolute; left:56px; top:50%; transform:translateY(-50%);
    background:var(--text); color:var(--surface); font-size:11.5px; font-weight:700;
    padding:5px 9px; border-radius:6px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s; z-index:40;
  }
  .rail-btn:hover .rail-tip { opacity:1; }

  .content { flex:1; overflow-y:auto; background:var(--bg); }

  /* ---- App-grid launcher popup ---- */
  .ovl { position:fixed; inset:0; background:rgba(15,23,42,.4); z-index:50; display:none; }
  .ovl.open { display:block; }
  .appgrid {
    position:absolute; top:60px; left:50%; transform:translateX(-50%);
    width:min(840px,94vw); max-height:80vh; overflow-y:auto;
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    box-shadow:var(--shadow-lg); padding:20px; animation:pop .16s ease;
  }
  .appgrid h4 { font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-muted); margin:14px 4px 8px; }
  .appgrid h4:first-child { margin-top:0; }
  .ag-row { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .ag-item { display:flex; flex-direction:column; align-items:center; gap:7px; padding:12px 6px; border-radius:12px; border:0; background:transparent; text-align:center; }
  .ag-item:hover { background:var(--surface-2); }
  .ag-item .name { font-size:11.5px; font-weight:600; color:var(--text); line-height:1.25; }

  /* ---- App icon ---- */
  .appico { border-radius:12px; display:grid; place-items:center; color:#fff; flex-shrink:0; }
  .appico svg { width:54%; height:54%; }

  /* ---- Launcher home ---- */
  .home { max-width:1180px; margin:0 auto; padding:30px 32px 60px; animation:fade .25s ease; }
  .home-hero { margin-bottom:24px; }
  .home-hero h1 { font-size:27px; letter-spacing:-.02em; }
  .home-hero p { color:var(--text-muted); font-size:14px; margin-top:3px; }
  .home-search { position:relative; margin:18px 0 6px; }
  .home-search svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:19px; height:19px; color:var(--text-muted); }
  .home-search input {
    width:100%; height:48px; border:1px solid var(--border); background:var(--surface);
    border-radius:12px; padding:0 16px 0 42px; font-size:15px; color:var(--text); outline:none; box-shadow:var(--shadow-sm);
  }
  .home-search input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--ring); }
  .cat { margin-top:26px; }
  .cat-h { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .cat-h h3 { font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); }
  .cat-h .ln { flex:1; height:1px; background:var(--border); }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .tile {
    display:flex; gap:13px; align-items:flex-start; padding:15px; border-radius:14px;
    background:var(--surface); border:1px solid var(--border); text-align:left; transition:all .15s ease;
  }
  .tile:hover { transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--primary); }
  .tile .appico { width:42px; height:42px; }
  .tile .tx b { font-size:14px; display:block; }
  .tile .tx span { font-size:12px; color:var(--text-muted); display:block; margin-top:2px; line-height:1.4; }
  .tile-empty { grid-column:1/-1; text-align:center; color:var(--text-muted); padding:40px; font-size:14px; }

  /* ---- App view shell ---- */
  .appview { animation:fade .22s ease; }
  .apphead {
    display:flex; align-items:center; gap:14px; padding:20px 28px;
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  .apphead .appico { width:46px; height:46px; }
  .apphead h2 { font-size:19px; letter-spacing:-.01em; }
  .apphead p { font-size:12.5px; color:var(--text-muted); }
  .apphead .ah-actions { margin-left:auto; display:flex; gap:8px; }
  .appbody { padding:22px 28px 50px; }

  /* ---- Buttons ---- */
  .btn { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700;
    padding:9px 15px; border-radius:9px; border:1px solid transparent; transition:all .14s ease; }
  .btn svg { width:16px; height:16px; }
  .btn-pri { background:var(--primary); color:#fff; }
  .btn-pri:hover { background:var(--primary-hover); }
  .btn-gho { background:var(--surface); color:var(--text); border-color:var(--border); }
  .btn-gho:hover { background:var(--surface-2); }
  .btn-sm { padding:6px 11px; font-size:12px; }
  .icon-btn { width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text-soft); display:grid; place-items:center; }
  .icon-btn:hover { background:var(--surface-2); color:var(--primary); }
  .icon-btn svg { width:17px; height:17px; }

  /* ---- KPI / stat cards ---- */
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:16px; }
  .kpi .k-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .kpi .k-ic { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; }
  .kpi .k-ic svg { width:17px; height:17px; }
  .kpi .k-val { font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .kpi .k-lbl { font-size:12px; color:var(--text-muted); }
  .k-delta { font-size:11.5px; font-weight:700; }
  .k-up { color:#1e8e5a; } .k-down { color:#e2574c; }

  /* ---- Panel ---- */
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:13px; }
  .panel-h { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); }
  .panel-h h3 { font-size:14px; }
  .panel-b { padding:16px 18px; }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }

  /* ---- Table ---- */
  table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
  table.tbl th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--text-muted); background:var(--surface-2); padding:10px 16px; }
  table.tbl td { padding:11px 16px; border-top:1px solid var(--border); }
  table.tbl tbody tr:hover { background:var(--surface-2); }
  .tbl-wrap { overflow:hidden; border:1px solid var(--border); border-radius:13px; }

  /* ---- Badge / avatar / chips ---- */
  .badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; }
  .badge .d { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .b-green { background:rgba(30,142,90,.14); color:#1e8e5a; }
  .b-amber { background:rgba(224,139,45,.16); color:#cc7a1f; }
  .b-red { background:rgba(226,87,76,.14); color:#e2574c; }
  .b-blue { background:var(--primary-soft); color:var(--primary); }
  .b-gray { background:var(--surface-2); color:var(--text-soft); }
  .b-violet { background:rgba(155,89,182,.16); color:#9b59b6; }
  .avatar { border-radius:50%; display:inline-grid; place-items:center; color:#fff; font-weight:800; flex-shrink:0; }

  /* ---- Board / kanban ---- */
  .board { display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; }
  .bcol { flex:0 0 270px; background:var(--surface-2); border:1px solid var(--border); border-radius:13px; padding:10px; }
  .bcol-h { display:flex; align-items:center; gap:7px; padding:4px 6px 10px; font-size:12.5px; font-weight:800; }
  .bcol-h .cnt { margin-left:auto; font-size:11px; color:var(--text-muted); background:var(--surface); padding:1px 8px; border-radius:999px; }
  .bcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:8px; box-shadow:var(--shadow-sm); }
  .bcard:last-child { margin-bottom:0; }
  .bcard h4 { font-size:13px; margin-bottom:5px; }
  .bcard p { font-size:11.5px; color:var(--text-muted); margin-bottom:9px; }
  .bcard .meta { display:flex; align-items:center; gap:6px; }

  /* ---- Mail ---- */
  .mail { display:grid; grid-template-columns:180px 320px 1fr; height:calc(100vh - 56px - 87px); }
  .mfolders { border-right:1px solid var(--border); background:var(--surface); padding:12px 8px; overflow-y:auto; }
  .mfolder { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; font-size:13px; font-weight:600; color:var(--text-soft); border:0; background:transparent; width:100%; }
  .mfolder:hover { background:var(--surface-2); }
  .mfolder.on { background:var(--primary-soft); color:var(--primary); }
  .mfolder .mf-c { margin-left:auto; font-size:11px; color:var(--text-muted); }
  .mlist { border-right:1px solid var(--border); background:var(--surface); overflow-y:auto; }
  .mrow { padding:12px 15px; border-bottom:1px solid var(--border); border-left:3px solid transparent; }
  .mrow:hover { background:var(--surface-2); }
  .mrow.on { background:var(--primary-soft); border-left-color:var(--primary); }
  .mrow.unread .mr-from { font-weight:800; }
  .mrow .mr-top { display:flex; justify-content:space-between; gap:8px; }
  .mr-from { font-size:13px; }
  .mr-time { font-size:11px; color:var(--text-muted); flex-shrink:0; }
  .mr-subj { font-size:12.5px; margin-top:2px; }
  .mr-prev { font-size:11.5px; color:var(--text-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mread { background:var(--surface); overflow-y:auto; padding:24px 28px; }
  .mread h2 { font-size:19px; margin-bottom:14px; }
  .mread .mr-meta { display:flex; align-items:center; gap:10px; padding-bottom:16px; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .mread p { font-size:14px; color:var(--text-soft); margin-bottom:12px; }
  .mempty { display:grid; place-items:center; height:100%; color:var(--text-muted); font-size:14px; }

  /* ---- Chat (Cliq) ---- */
  .chat { display:grid; grid-template-columns:230px 1fr; height:calc(100vh - 56px - 87px); }
  .ch-side { border-right:1px solid var(--border); background:var(--surface); overflow-y:auto; padding:10px 8px; }
  .ch-side .ch-grp { font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); padding:10px 8px 5px; }
  .ch-item { display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; font-size:13px; width:100%; border:0; background:transparent; color:var(--text-soft); }
  .ch-item:hover { background:var(--surface-2); }
  .ch-item.on { background:var(--primary-soft); color:var(--primary); font-weight:700; }
  .ch-item .uc { margin-left:auto; background:#e2574c; color:#fff; font-size:10px; font-weight:800; padding:0 6px; border-radius:999px; }
  .ch-main { display:flex; flex-direction:column; background:var(--bg); }
  .ch-head { padding:13px 18px; border-bottom:1px solid var(--border); background:var(--surface); font-weight:800; font-size:14px; }
  .ch-msgs { flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:12px; }
  .msg { display:flex; gap:10px; }
  .msg .mbody b { font-size:12.5px; } .msg .mbody .mt { font-size:10px; color:var(--text-muted); margin-left:6px; }
  .msg .mbody p { font-size:13px; color:var(--text-soft); background:var(--surface); border:1px solid var(--border); border-radius:0 10px 10px 10px; padding:8px 11px; margin-top:3px; display:inline-block; }
  .msg.me { flex-direction:row-reverse; }
  .msg.me .mbody { text-align:right; }
  .msg.me .mbody p { background:var(--primary); color:#fff; border-color:var(--primary); border-radius:10px 0 10px 10px; }
  .ch-composer { display:flex; gap:9px; padding:12px 18px; border-top:1px solid var(--border); background:var(--surface); }
  .ch-composer input { flex:1; height:40px; border:1px solid var(--border); background:var(--surface-2); border-radius:9px; padding:0 13px; font-size:13.5px; color:var(--text); outline:none; }
  .ch-composer input:focus { border-color:var(--primary); }

  /* ---- Calendar ---- */
  .cal-bar { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .cal-bar h3 { font-size:17px; min-width:170px; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--border); border-radius:13px; overflow:hidden; background:var(--border); gap:1px; }
  .cal-dow { background:var(--surface-2); padding:8px; text-align:center; font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase; }
  .cal-cell { background:var(--surface); min-height:96px; padding:7px 8px; }
  .cal-cell.dim { background:var(--surface-2); }
  .cal-cell .dn { font-size:12px; font-weight:700; color:var(--text-soft); }
  .cal-cell.today .dn { background:var(--primary); color:#fff; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; }
  .cal-ev { font-size:10.5px; font-weight:700; color:#fff; padding:2px 6px; border-radius:5px; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---- To Do ---- */
  .todo-wrap { max-width:640px; }
  .todo-add { display:flex; gap:9px; margin-bottom:16px; }
  .todo-add input { flex:1; height:42px; border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:0 14px; font-size:14px; color:var(--text); outline:none; }
  .todo-add input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--ring); }
  .todo-item { display:flex; align-items:center; gap:12px; padding:13px 15px; background:var(--surface); border:1px solid var(--border); border-radius:11px; margin-bottom:8px; }
  .todo-check { width:21px; height:21px; border-radius:6px; border:2px solid var(--border); display:grid; place-items:center; flex-shrink:0; background:transparent; color:#fff; }
  .todo-item.done .todo-check { background:var(--primary); border-color:var(--primary); }
  .todo-item.done .todo-text { text-decoration:line-through; color:var(--text-muted); }
  .todo-text { flex:1; font-size:14px; }
  .todo-del { opacity:0; border:0; background:transparent; color:var(--text-muted); padding:4px; border-radius:6px; }
  .todo-item:hover .todo-del { opacity:1; }
  .todo-del:hover { background:var(--surface-2); color:#e2574c; }

  /* ---- Notes ---- */
  .notes { columns:4; column-gap:13px; }
  .note { break-inside:avoid; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:13px; }
  .note h4 { font-size:13.5px; margin-bottom:6px; }
  .note p { font-size:12px; color:var(--text-soft); }
  .note .tg { display:inline-block; margin-top:9px; font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; }

  /* ---- Card grid (files etc) ---- */
  .cardgrid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  .fcard { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center; }
  .fcard:hover { border-color:var(--primary); box-shadow:var(--shadow-sm); }
  .fcard .fic { width:46px; height:46px; border-radius:10px; margin:0 auto 9px; display:grid; place-items:center; color:#fff; font-size:11px; font-weight:800; }
  .fcard b { font-size:12.5px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fcard span { font-size:11px; color:var(--text-muted); }

  /* ---- List rows ---- */
  .lrow { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); }
  .lrow:last-child { border-bottom:0; }
  .lrow:hover { background:var(--surface-2); }
  .lrow .lr-main b { font-size:13px; } .lrow .lr-main span { font-size:11.5px; color:var(--text-muted); display:block; }

  /* ---- misc ---- */
  .muted { color:var(--text-muted); }
  .progress { height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
  .progress > i { display:block; height:100%; background:var(--primary); border-radius:999px; }
  .empty-note { text-align:center; color:var(--text-muted); padding:40px; font-size:13px; }
  .chart-bars { display:flex; align-items:flex-end; gap:12px; height:150px; }
  .chart-bars .cb { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .chart-bars .cb i { width:100%; max-width:34px; border-radius:6px 6px 0 0; background:var(--primary); }
  .chart-bars .cb span { font-size:10.5px; color:var(--text-muted); font-weight:600; }

  @media (max-width:1100px){
    .tiles{grid-template-columns:repeat(3,1fr);} .kpis{grid-template-columns:repeat(2,1fr);}
    .cardgrid{grid-template-columns:repeat(3,1fr);} .notes{columns:3;}
    .ag-row{grid-template-columns:repeat(4,1fr);}
  }
  @media (max-width:760px){
    .tiles{grid-template-columns:repeat(2,1fr);} .mail,.chat{grid-template-columns:1fr;}
    .tb-search{display:none;} .grid-2,.grid-3{grid-template-columns:1fr;} .notes{columns:2;}
  }
</style>

/* ============ APP ROUTER ============ */
function openApp(id){
  var app = appById(id);
  if(!app) return;
  setRail(id);
  el('wsContent').scrollTop = 0;
  var custom = { cliq:renderCliq, calendar:renderCalendar, todo:renderToDo,
                 notebook:renderNotebook, crm:renderCRM, workdrive:renderWorkDrive };
  if(custom[app.type]) custom[app.type](app);
  else renderGeneric(app);
}

/* ============ WORKSPACE API (live data) ============ */
var WS_API = (function(){
  try { var p = new URLSearchParams(location.search).get('api'); if(p) return p; } catch(e){}
  return 'http://localhost:8081/api';
})();
function wsFetch(path, opts){
  return fetch(WS_API + path, opts).then(function(r){
    if(!r.ok) throw new Error('Server returned ' + r.status);
    return r.json();
  });
}
function wsGet(app){ return wsFetch('/workspace/' + app + '/records'); }
function wsCreate(app, rec){
  return wsFetch('/workspace/' + app + '/records',
    { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(rec) });
}
function wsUpdate(app, id, patch){
  return wsFetch('/workspace/' + app + '/records/' + id,
    { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(patch) });
}
function wsDelete(app, id){
  return wsFetch('/workspace/' + app + '/records/' + id, { method:'DELETE' });
}
function loadingHTML(app){
  return '<div class="appview">' + appHead(app,'') +
    '<div class="appbody"><div class="empty-note">Loading ' + app.name + '&hellip;</div></div></div>';
}
function errorHTML(app, msg){
  return '<div class="appview">' + appHead(app,'') +
    '<div class="appbody"><div class="empty-note">Could not reach the Workspace server.<br>' +
    '<span style="font-size:11px">' + (msg||'') + ' &mdash; start the backend, then reload.</span>' +
    '</div></div></div>';
}

/* ============ GENERIC APP VIEW (live data) ============ */
function renderGeneric(app){
  var cols = SCHEMA[app.id] || [['name','Name'],['status','Status']];
  var ro = !!READONLY[app.id];
  el('wsContent').innerHTML = loadingHTML(app);
  wsGet(app.id).then(function(res){
    var recs = res.records || [];
    var h = '<div class="appview">' + appHead(app, ro ? '' : 'New ' + app.name)
      + '<div class="appbody"><div class="panel"><div class="panel-h"><h3>'
      + app.name + (ro ? ' &mdash; live HRMS data' : '') + '</h3>'
      + '<span class="muted" style="font-size:12px">' + recs.length + ' record'
      + (recs.length===1?'':'s') + '</span></div>';
    if(!recs.length){
      h += '<div class="empty-note">No records yet'
        + (ro ? '.' : ' &mdash; click &ldquo;New ' + app.name + '&rdquo; to add the first one.')
        + '</div>';
    } else {
      h += '<table class="tbl"><thead><tr>';
      cols.forEach(function(c){ h += '<th>' + c[1] + '</th>'; });
      if(!ro) h += '<th></th>';
      h += '</tr></thead><tbody>';
      recs.forEach(function(r){
        h += '<tr>';
        cols.forEach(function(c){
          var v = r[c[0]];
          h += '<td>' + (v==null ? '' : String(v)) + '</td>';
        });
        if(!ro) h += '<td style="text-align:right"><button class="btn btn-gho btn-sm" data-del="'
          + r.id + '">Delete</button></td>';
        h += '</tr>';
      });
      h += '</tbody></table>';
    }
    h += '</div></div></div>';
    el('wsContent').innerHTML = h;
    if(!ro){
      var addBtn = document.querySelector('.apphead .ah-actions .btn-pri');
      if(addBtn) addBtn.addEventListener('click', function(){ genericForm(app, cols); });
      el('wsContent').querySelectorAll('[data-del]').forEach(function(b){
        b.addEventListener('click', function(){
          wsDelete(app.id, b.dataset.del).then(function(){ renderGeneric(app); })
            .catch(function(e){ alert('Delete failed: ' + e.message); });
        });
      });
    }
  }).catch(function(e){ el('wsContent').innerHTML = errorHTML(app, e.message); });
}
function genericForm(app, cols){
  var ovl = document.createElement('div');
  ovl.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:90;';
  var fields = cols.map(function(c){
    return '<label style="display:block;font-size:12px;font-weight:700;margin:12px 0 5px;color:var(--text-soft)">'
      + c[1] + '</label><input data-k="' + c[0]
      + '" type="text" style="width:100%;height:38px;border:1px solid var(--border);border-radius:9px;'
      + 'padding:0 11px;font-size:13.5px;background:var(--surface-2);color:var(--text)">';
  }).join('');
  ovl.innerHTML = '<div style="position:absolute;top:64px;left:50%;transform:translateX(-50%);'
    + 'width:min(460px,92vw);max-height:84vh;overflow-y:auto;background:var(--surface);'
    + 'border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:22px">'
    + '<h3 style="margin-bottom:3px">New ' + app.name + '</h3>'
    + '<p class="muted" style="font-size:12px;margin-bottom:6px">This record is saved to the live database.</p>'
    + fields
    + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">'
    + '<button class="btn btn-gho btn-sm" data-cancel>Cancel</button>'
    + '<button class="btn btn-pri btn-sm" data-save>Save record</button></div></div>';
  document.body.appendChild(ovl);
  function close(){ if(ovl.parentNode) document.body.removeChild(ovl); }
  ovl.addEventListener('click', function(e){ if(e.target===ovl) close(); });
  ovl.querySelector('[data-cancel]').addEventListener('click', close);
  ovl.querySelector('[data-save]').addEventListener('click', function(){
    var rec = {};
    ovl.querySelectorAll('[data-k]').forEach(function(i){ rec[i.dataset.k] = i.value.trim(); });
    wsCreate(app.id, rec).then(function(){ close(); renderGeneric(app); })
      .catch(function(e){ alert('Save failed: ' + e.message); });
  });
  var first = ovl.querySelector('[data-k]'); if(first) first.focus();
}

/* ============ CLIQ (TEAM CHAT) ============ */
function renderCliq(){
  var app = appById('cliq');
  el('wsContent').innerHTML = loadingHTML(app);
  var ME = (function(){ try{ return new URLSearchParams(location.search).get('me') || 'You'; }catch(e){ return 'You'; } })();
  var WARM = ['#ff4500','#ff8c00','#e63e00','#ea580c','#d97706','#c2410c'];
  function colorFor(x){ var h=0,i,t=String(x||'?'); for(i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))&0xffffff; return WARM[h%WARM.length]; }
  function initials(n){ return String(n||'?').split(' ').filter(Boolean).slice(0,2).map(function(w){return w[0].toUpperCase();}).join(''); }
  function now(){ var d=new Date(); return d.getHours()+':'+('0'+d.getMinutes()).slice(-2); }
  var people=[], msgs=[], cur='general', curName='General';

  function load(){
    Promise.all([wsGet('people'), wsGet('cliq')]).then(function(r){
      people = r[0].records || [];
      msgs = r[1].records || [];
      shell();
    }).catch(function(e){ el('wsContent').innerHTML = errorHTML(app, e.message); });
  }
  function refresh(){ wsGet('cliq').then(function(r){ msgs = r.records || []; drawSide(); drawThread(); }); }

  function shell(){
    el('wsContent').innerHTML = '<div class="appview">' + appHead(app,'')
      + '<div class="chat"><div class="ch-side" id="chSide"></div>'
      + '<div class="ch-main"><div class="ch-head" id="chHead"></div>'
      + '<div class="ch-msgs" id="chMsgs"></div>'
      + '<div class="ch-composer">'
      + '<input id="chFile" type="file" style="display:none">'
      + '<button class="btn btn-gho" id="chAttach" title="Share a file" style="white-space:nowrap">&#128206; File</button>'
      + '<input id="chInput" type="text" placeholder="Write a message..." autocomplete="off">'
      + '<button class="btn btn-pri" id="chSend">Send</button>'
      + '</div></div></div></div>';
    drawSide(); drawHead(); drawThread();
    el('chSend').addEventListener('click', send);
    el('chInput').addEventListener('keydown', function(e){ if(e.key==='Enter') send(); });
    el('chAttach').addEventListener('click', function(){ el('chFile').click(); });
    el('chFile').addEventListener('change', function(){ if(this.files && this.files[0]) shareFile(this.files[0]); });
  }
  function drawSide(){
    var h = '<div class="ch-grp">Channels</div>'
      + '<button class="ch-item' + (cur==='general'?' on':'') + '" data-c="general" data-n="General"># general</button>';
    h += '<div class="ch-grp">Team members (' + people.length + ')</div>';
    h += people.length ? people.map(function(pp){
      var unread = msgs.filter(function(m){ return m.channel===pp.id && m.who!==ME; }).length;
      return '<button class="ch-item' + (cur===pp.id?' on':'') + '" data-c="' + pp.id + '" data-n="' + pp.name + '">'
        + '<span class="avatar" style="width:22px;height:22px;font-size:9px;background:' + colorFor(pp.name) + '">'
        + initials(pp.name) + '</span>'
        + '<span style="flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + pp.name + '</span>'
        + (unread ? '<span class="uc">' + unread + '</span>' : '') + '</button>';
    }).join('') : '<div class="muted" style="padding:8px 12px;font-size:12px">No employees in the HRMS yet.</div>';
    el('chSide').innerHTML = h;
    el('chSide').querySelectorAll('[data-c]').forEach(function(b){
      b.addEventListener('click', function(){
        cur = b.dataset.c; curName = b.dataset.n; drawSide(); drawHead(); drawThread();
      });
    });
  }
  function drawHead(){
    var who = people.filter(function(pp){ return pp.id===cur; })[0];
    el('chHead').textContent = cur==='general' ? '# general'
      : curName + (who && who.role ? '  -  ' + who.role : '');
  }
  function drawThread(){
    var list = msgs.filter(function(m){ return (m.channel||'general')===cur; })
      .sort(function(a,b){ return (a.createdAt||'') < (b.createdAt||'') ? -1 : 1; });
    el('chMsgs').innerHTML = list.length ? list.map(function(m){
      var mine = m.who===ME;
      var body = m.fileId
        ? '<a href="' + WS_API + '/workdrive/download/' + m.fileId + '" target="_blank" rel="noopener" '
          + 'style="color:var(--primary);font-weight:600;text-decoration:none">&#128206; '
          + (m.fileName||'Shared file') + '</a>' + (m.text ? '<br>' + m.text : '')
        : (m.text||'');
      return '<div class="msg' + (mine?' me':'') + '">'
        + '<span class="avatar" style="width:32px;height:32px;font-size:11px;background:' + colorFor(m.who) + '">'
        + initials(m.who) + '</span>'
        + '<div class="mbody"><b>' + (m.who||'?') + '</b><span class="mt">' + (m.time||'') + '</span>'
        + '<p>' + body + '</p></div></div>';
    }).join('') : '<div class="empty-note">No messages in this conversation yet. Say hello!</div>';
    var box = el('chMsgs'); if(box) box.scrollTop = box.scrollHeight;
  }
  function send(){
    var v = el('chInput').value.trim(); if(!v) return;
    el('chInput').value = '';
    wsCreate('cliq', { channel:cur, who:ME, text:v, time:now() }).then(refresh)
      .catch(function(e){ alert('Send failed: ' + e.message); });
  }
  function shareFile(file){
    var fd = new FormData();
    fd.append('folder_id', 'cliq-files');
    fd.append('owner_id', ME);
    fd.append('files', file);
    el('chHead').textContent = 'Uploading ' + file.name + '...';
    fetch(WS_API + '/workdrive/upload', { method:'POST', body:fd }).then(function(r){
      if(!r.ok) throw new Error('upload ' + r.status);
      return r.json();
    }).then(function(res){
      var it = (res.items && res.items[0]) || {};
      return wsCreate('cliq', { channel:cur, who:ME, text:'', time:now(), fileId:it.id, fileName:it.name });
    }).then(function(){ el('chFile').value=''; drawHead(); refresh(); })
      .catch(function(e){ drawHead(); alert('File share failed: ' + e.message); });
  }
  load();
}

/* ============ CALENDAR ============ */
function renderCalendar(){
  var app = appById('calendar');
  el('wsContent').innerHTML = loadingHTML(app);
  wsGet('calendar').then(function(res){
    var recs = res.records || [];
    var EV = {};
    recs.forEach(function(r){
      var d = new Date(r.date);
      if(isNaN(d.getTime())) return;
      var k = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
      (EV[k] = EV[k] || []).push([r.title || 'Event', '#ff4500']);
    });
    var view = new Date(); view.setDate(1);
    var today = new Date();
    var chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">';
    el('wsContent').innerHTML = '<div class="appview">' + appHead(app,'')
      + '<div class="appbody"><p class="muted" style="font-size:12px;margin-bottom:10px">'
      + 'Live company holidays from the HRMS &mdash; ' + recs.length + ' event'
      + (recs.length===1?'':'s') + '.</p><div class="cal-bar">'
      + '<button class="icon-btn" id="cPrev">' + chev + '<path d="M15 6l-6 6 6 6"/></svg></button>'
      + '<h3 id="cTitle"></h3>'
      + '<button class="icon-btn" id="cNext">' + chev + '<path d="M9 6l6 6-6 6"/></svg></button>'
      + '<button class="btn btn-gho btn-sm" id="cToday">Today</button></div>'
      + '<div class="cal" id="cGrid"></div></div></div>';
    function draw(){
      var y = view.getFullYear(), m = view.getMonth();
      el('cTitle').textContent = view.toLocaleDateString('en-US',{month:'long',year:'numeric'});
      var first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate(), prevD = new Date(y,m,0).getDate();
      var dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      var h = dows.map(function(d){ return '<div class="cal-dow">' + d + '</div>'; }).join('');
      var cells = [], i;
      for(i=0;i<first;i++) cells.push({d:prevD-first+1+i,dim:true});
      for(i=1;i<=days;i++) cells.push({d:i,y:y,m:m});
      while(cells.length%7) cells.push({d:1,dim:true});
      cells.forEach(function(c){
        var isT = !c.dim && c.y===today.getFullYear() && c.m===today.getMonth() && c.d===today.getDate();
        var evs = (!c.dim && EV[c.y+'-'+c.m+'-'+c.d]) || [];
        h += '<div class="cal-cell' + (c.dim?' dim':'') + (isT?' today':'') + '"><div class="dn">' + c.d + '</div>'
          + evs.map(function(e){ return '<div class="cal-ev" style="background:'+e[1]+'">'+e[0]+'</div>'; }).join('')
          + '</div>';
      });
      el('cGrid').innerHTML = h;
    }
    draw();
    el('cPrev').addEventListener('click', function(){ view.setMonth(view.getMonth()-1); draw(); });
    el('cNext').addEventListener('click', function(){ view.setMonth(view.getMonth()+1); draw(); });
    el('cToday').addEventListener('click', function(){ view = new Date(); view.setDate(1); draw(); });
  }).catch(function(e){ el('wsContent').innerHTML = errorHTML(app, e.message); });
}

/* ============ TO DO ============ */
function renderToDo(){
  var app = appById('todo');
  el('wsContent').innerHTML = loadingHTML(app);
  var chk = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 6.5"/></svg>';
  var del = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
  function load(){
    wsGet('todo').then(function(res){ draw(res.records || []); })
      .catch(function(e){ el('wsContent').innerHTML = errorHTML(app, e.message); });
  }
  function draw(tasks){
    el('wsContent').innerHTML = '<div class="appview">' + appHead(app,'')
      + '<div class="appbody"><div class="todo-wrap">'
      + '<div class="todo-add"><input id="tdInput" type="text" placeholder="Add a task and press Enter..." autocomplete="off">'
      + '<button class="btn btn-pri" id="tdAdd">Add task</button></div>'
      + '<div id="tdList"></div><p class="muted" id="tdCount" style="margin-top:12px;font-size:12px"></p>'
      + '</div></div></div>';
    el('tdList').innerHTML = tasks.length ? tasks.map(function(t){
      return '<div class="todo-item' + (t.done?' done':'') + '">'
        + '<button class="todo-check" data-check="' + t.id + '" data-done="' + (t.done?1:0) + '">'
        + (t.done?chk:'') + '</button>'
        + '<span class="todo-text">' + (t.text||'') + '</span>'
        + '<button class="todo-del" data-del="' + t.id + '">' + del + '</button></div>';
    }).join('') : '<div class="empty-note">No tasks yet &mdash; add one above.</div>';
    var done = tasks.filter(function(t){ return t.done; }).length;
    el('tdCount').textContent = tasks.length ? (done + ' of ' + tasks.length + ' completed') : '';
    el('tdList').querySelectorAll('[data-check]').forEach(function(b){
      b.addEventListener('click', function(){
        wsUpdate('todo', b.dataset.check, { done: b.dataset.done !== '1' }).then(load)
          .catch(function(e){ alert('Update failed: ' + e.message); });
      });
    });
    el('tdList').querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click', function(){ wsDelete('todo', b.dataset.del).then(load); });
    });
    function add(){
      var v = el('tdInput').value.trim(); if(!v) return;
      wsCreate('todo', { text:v, done:false }).then(load)
        .catch(function(e){ alert('Save failed: ' + e.message); });
    }
    el('tdAdd').addEventListener('click', add);
    el('tdInput').addEventListener('keydown', function(e){ if(e.key==='Enter') add(); });
  }
  load();
}

/* ============ NOTEBOOK ============ */
function renderNotebook(){
  var app = appById('notebook');
  var COLORS = ['#ff4500','#e63e00','#ff8c00','#ea580c','#d97706','#c2410c'];
  el('wsContent').innerHTML = loadingHTML(app);
  function load(){
    wsGet('notebook').then(function(res){ draw(res.records || []); })
      .catch(function(e){ el('wsContent').innerHTML = errorHTML(app, e.message); });
  }
  function draw(notes){
    el('wsContent').innerHTML = '<div class="appview">' + appHead(app,'New note')
      + '<div class="appbody"><div class="notes" id="nbList"></div></div></div>';
    el('nbList').innerHTML = notes.length ? notes.map(function(n){
      var c = n.color || '#ff4500';
      return '<div class="note"><h4>' + (n.title||'Untitled') + '</h4><p>' + (n.body||'') + '</p>'
        + '<span class="tg" style="background:' + c + '22;color:' + c + '">' + (n.tag||'Note') + '</span>'
        + '<button class="btn btn-gho btn-sm" data-del="' + n.id + '" style="margin-top:10px">Delete</button></div>';
    }).join('') : '<div class="empty-note">No notes yet &mdash; click &ldquo;New note&rdquo;.</div>';
    var addBtn = document.querySelector('.apphead .ah-actions .btn-pri');
    if(addBtn) addBtn.addEventListener('click', function(){
      var title = prompt('Note title:');
      if(title===null || !title.trim()) return;
      var body = prompt('Note text:') || '';
      wsCreate('notebook', { title:title.trim(), body:body, tag:'Note',
        color:COLORS[Math.floor(Math.random()*COLORS.length)] }).then(load)
        .catch(function(e){ alert('Save failed: ' + e.message); });
    });
    el('nbList').querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click', function(){ wsDelete('notebook', b.dataset.del).then(load); });
    });
  }
  load();
}

/* ============ CRM (PIPELINE BOARD) ============ */
function renderCRM(){
  var app = appById('crm');
  var stages = [{id:'lead',name:'Lead'},{id:'qualified',name:'Qualified'},{id:'proposal',name:'Proposal'},{id:'negotiation',name:'Negotiation'},{id:'won',name:'Won'}];
  el('wsContent').innerHTML = loadingHTML(app);
  function load(){
    wsGet('crm').then(function(res){ draw(res.records || []); })
      .catch(function(e){ el('wsContent').innerHTML = errorHTML(app, e.message); });
  }
  function draw(deals){
    el('wsContent').innerHTML = '<div class="appview">' + appHead(app,'New deal')
      + '<div class="appbody"><p class="muted" style="font-size:12.5px;margin-bottom:14px">'
      + deals.length + ' deal' + (deals.length===1?'':'s')
      + ' &middot; click <b>Move &rarr;</b> to advance a deal. Every change is saved to the database.</p>'
      + '<div class="board" id="crmBoard"></div></div></div>';
    el('crmBoard').innerHTML = stages.map(function(st,si){
      var ds = deals.filter(function(d){ return (d.stage||'lead')===st.id; });
      return '<div class="bcol"><div class="bcol-h">' + st.name + '<span class="cnt">' + ds.length + '</span></div>'
        + ds.map(function(d){
            return '<div class="bcard"><h4>' + (d.company||'Untitled') + '</h4><p>' + (d.value||'') + '</p>'
              + '<div class="meta"><span class="muted" style="font-size:11px">' + (d.owner||'Unassigned') + '</span>'
              + (si<stages.length-1 ? '<button class="btn btn-gho btn-sm" data-adv="' + d.id + '" data-st="' + st.id + '" style="margin-left:auto;padding:3px 9px">Move &rarr;</button>' : '<span style="margin-left:auto"></span>')
              + '<button class="btn btn-gho btn-sm" data-del="' + d.id + '" style="padding:3px 8px">&times;</button>'
              + '</div></div>';
          }).join('')
        + '</div>';
    }).join('');
    el('crmBoard').querySelectorAll('[data-adv]').forEach(function(b){
      b.addEventListener('click', function(){
        var i = stages.map(function(s){ return s.id; }).indexOf(b.dataset.st);
        if(i>=0 && i<stages.length-1) wsUpdate('crm', b.dataset.adv, { stage:stages[i+1].id }).then(load);
      });
    });
    el('crmBoard').querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click', function(){ wsDelete('crm', b.dataset.del).then(load); });
    });
    var addBtn = document.querySelector('.apphead .ah-actions .btn-pri');
    if(addBtn) addBtn.addEventListener('click', function(){
      var company = prompt('Company name:');
      if(company===null || !company.trim()) return;
      var value = prompt('Deal value (e.g. $24,000):') || '';
      var owner = prompt('Deal owner:') || '';
      wsCreate('crm', { company:company.trim(), value:value, owner:owner, stage:'lead' }).then(load)
        .catch(function(e){ alert('Save failed: ' + e.message); });
    });
  }
  load();
}

/* ============ WORKDRIVE (FILES) ============ */
function renderWorkDrive(){
  var app = appById('workdrive');
  el('wsContent').innerHTML = loadingHTML(app);
  wsFetch('/workdrive/state').then(function(st){
    var tfs = st.teamFolders || [], items = st.items || [];
    var roots = items.filter(function(it){
      return it.parentId==='my-root' || tfs.some(function(t){ return t.id===it.parentId; });
    });
    var h = '<div class="appview">' + appHead(app,'')
      + '<div class="appbody"><div class="panel"><div class="panel-h"><h3>WorkDrive &mdash; live files</h3>'
      + '<span class="muted" style="font-size:12px">' + tfs.length + ' Team Folder'
      + (tfs.length===1?'':'s') + ' &middot; ' + items.length + ' item' + (items.length===1?'':'s') + '</span></div>';
    if(!tfs.length && !roots.length){
      h += '<div class="empty-note">WorkDrive is empty. Open the full <b>WorkDrive</b> module from the sidebar to create Team Folders and upload files &mdash; they will appear here.</div>';
    } else {
      h += '<div class="panel-b"><div class="cardgrid">'
        + tfs.map(function(t){
            return '<div class="fcard"><div class="fic" style="background:' + (t.color||'#ff4500') + '">TF</div>'
              + '<b>' + t.name + '</b><span>' + ((t.members&&t.members.length)||0) + ' members</span></div>';
          }).join('')
        + roots.map(function(it){
            var ext = (it.name.indexOf('.')>=0 ? it.name.split('.').pop() : 'file').toUpperCase().slice(0,4);
            var k = it.type==='folder' ? 'DIR' : ext;
            return '<div class="fcard"><div class="fic" style="background:' + (it.type==='folder'?'#ff8c00':'#ff4500') + '">' + k + '</div>'
              + '<b>' + it.name + '</b><span>' + (it.type==='folder'?'Folder':'File') + '</span></div>';
          }).join('')
        + '</div></div>';
    }
    h += '</div></div></div>';
    el('wsContent').innerHTML = h;
  }).catch(function(e){ el('wsContent').innerHTML = errorHTML(app, e.message); });
}

/* ============ APP-GRID SEARCH ============ */
function appGridFilter(q){
  q = (q||'').toLowerCase();
  var h = '';
  CATS.forEach(function(c){
    var list = APPS.filter(function(a){
      return a.cat===c.id && (a.name.toLowerCase().indexOf(q)>=0 || a.tag.toLowerCase().indexOf(q)>=0);
    });
    if(!list.length) return;
    h += '<h4>'+c.name+'</h4><div class="ag-row">'+list.map(function(a){
      return '<button class="ag-item" data-open="'+a.id+'">'+appIcon(a,40)+'<span class="name">'+a.name+'</span></button>';
    }).join('')+'</div>';
  });
  if(!h) h = '<div class="tile-empty">No apps found.</div>';
  el('appGrid').innerHTML = h;
  el('appGrid').querySelectorAll('[data-open]').forEach(function(b){
    b.addEventListener('click', function(){ closeAppGrid(); openApp(b.dataset.open); });
  });
}

/* ============ INIT & GLOBAL EVENTS ============ */
renderRail();
renderAppGrid();
renderHome();

/* theme switching */
document.querySelectorAll('[data-theme-btn]').forEach(function(sw){
  sw.addEventListener('click', function(){
    document.documentElement.setAttribute('data-theme', sw.dataset.themeBtn);
    document.querySelectorAll('[data-theme-btn]').forEach(function(s){ s.classList.remove('on'); });
    sw.classList.add('on');
  });
});

/* app-grid launcher */
el('appGridBtn').addEventListener('click', toggleAppGrid);
el('appGridOvl').addEventListener('click', function(e){
  if(e.target===el('appGridOvl')) closeAppGrid();
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') closeAppGrid();
});

/* global search */
el('globalSearch').addEventListener('input', function(){
  var q = this.value.trim();
  if(q){ appGridFilter(q); el('appGridOvl').classList.add('open'); }
  else { appGridFilter(''); closeAppGrid(); }
});
el('globalSearch').addEventListener('keydown', function(e){
  if(e.key==='Enter'){
    var q = this.value.trim().toLowerCase();
    if(!q) return;
    var m = APPS.filter(function(a){
      return a.name.toLowerCase().indexOf(q)>=0 || a.tag.toLowerCase().indexOf(q)>=0;
    })[0];
    if(m){ closeAppGrid(); this.value=''; openApp(m.id); }
  }
});

/* "Home" buttons inside app views (delegated) */
el('wsContent').addEventListener('click', function(e){
  if(e.target.closest('[data-gohome]')) goHome();
});
